<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maktadmin</title>
<meta name="description" content="Maktadmin — maktab maslahatchisining raqamli yordamchisi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  // Mavzuni sahifa chizilishidan oldin qo'llash (miltillamasligi uchun)
  (function () {
    var t = null;
    try { t = localStorage.getItem("ma-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div id="root"></div>
<div id="tooltip" class="tooltip hidden"></div>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>

</body>
